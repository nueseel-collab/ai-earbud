<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Earbud</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #111; color: #eee; }
  button { font-size: 20px; padding: 18px; width: 100%; border-radius: 14px; border: 0; background: #3b82f6; color: #fff; margin: 12px 0; }
  button.listening { background: #ef4444; }
  select, input { width: 100%; padding: 10px; font-size: 16px; margin: 6px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; box-sizing: border-box; }
  .box { background: #1d1d1d; border-radius: 10px; padding: 12px; margin: 8px 0; min-height: 24px; white-space: pre-wrap; }
  small { color: #888; }
</style>
</head>
<body>
<h2>AI Earbud (test)</h2>

<input id="key" type="password" placeholder="Paste Gemini API key here (saved on this device only)">
<select id="lang">
  <option value="en-US">English</option>
  <option value="ru-RU">Русский</option>
  <option value="sv-SE">Svenska</option>
</select>
<select id="mode">
  <option value="short">Short answers (in a conversation)</option>
  <option value="full">Full answers (when alone)</option>
</select>

<button id="talk">Tap and ask</button>

<small>You said:</small><div class="box" id="heard"></div>
<small>AI:</small><div class="box" id="answer"></div>
<div class="box" id="status"></div>

<script>
// If you get a "model not found" error, change this to 'gemini-3.1-flash-lite'
const MODEL = 'gemini-3.5-flash-lite';

const $ = id => document.getElementById(id);
const keyInput = $('key'), langSel = $('lang'), modeSel = $('mode'), talk = $('talk');

// remember settings on this device only
for (const [el, name] of [[keyInput, 'gkey'], [langSel, 'lang'], [modeSel, 'mode']]) {
  try { el.value = localStorage.getItem(name) || el.value; } catch (e) {}
  el.addEventListener('input', () => { try { localStorage.setItem(name, el.value); } catch (e) {} });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const history = [];

function say(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langSel.value;
  speechSynthesis.speak(u);
}

async function ask(question) {
  const extra = " Today is " + new Date().toLocaleString() + ". You have no internet access, so you cannot know live information like weather, news, prices or scores. If asked, say plainly that you can't check that live. Never invent facts. If you are unsure, say so.";
  const shortStyle = "You are a friendly voice assistant in the user's earbud while they talk to someone. Answer in one or two short sentences. No lists, no markdown, no links. Reply in the language the user speaks.";
  const fullStyle = "You are a friendly voice assistant in the user's earbud. Explain clearly and fully, like a patient guide. No lists, no markdown, no links, because your answer is read aloud. Reply in the language the user speaks.";
  const system = (modeSel.value === 'short' ? shortStyle : fullStyle) + extra;
  const contents = [...history, { role: 'user', parts: [{ text: question }] }];
  const res = await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent',
    {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-goog-api-key': keyInput.value.trim()
      },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents,
        generationConfig: { maxOutputTokens: 1000 }
      })
    }
  );
  const data = await res.json();
  if (!res.ok) throw new Error((data.error && data.error.message) || 'Request failed');
  const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
  const answer = parts.map(p => p.text || '').join(' ').trim() || '(no answer)';
  history.push({ role: 'user', parts: [{ text: question }] }, { role: 'model', parts: [{ text: answer }] });
  if (history.length > 12) history.splice(0, 2);
  return answer;
}

talk.addEventListener('click', () => {
  if (!SR) { $('status').textContent = 'No speech recognition here. Use Safari on iPhone or Chrome on PC.'; return; }
  if (!keyInput.value.trim()) { $('status').textContent = 'Paste your API key first.'; return; }

  // unlocks audio playback on iPhone
  speechSynthesis.cancel();
  const prime = new SpeechSynthesisUtterance(' ');
  prime.volume = 0;
  speechSynthesis.speak(prime);

  const rec = new SR();
  rec.lang = langSel.value;
  rec.interimResults = false;
  rec.onstart = () => { talk.classList.add('listening'); talk.textContent = 'Listening...'; $('status').textContent = ''; };
  rec.onerror = e => { $('status').textContent = 'Mic error: ' + e.error; };
  rec.onend = () => { talk.classList.remove('listening'); talk.textContent = 'Tap and ask'; };
  rec.onresult = async e => {
    const q = e.results[0][0].transcript;
    $('heard').textContent = q;
    $('answer').textContent = '...';
    try {
      const a = await ask(q);
      $('answer').textContent = a;
      say(a);
    } catch (err) {
      $('answer').textContent = '';
      $('status').textContent = 'Error: ' + err.message;
    }
  };
  rec.start();
});
</script>
</body>
</html>
